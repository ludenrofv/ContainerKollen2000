<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Containerregister</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:40px;
}

.card{
    max-width:500px;
    width:100%;
    margin:auto;
    padding:30px;
    background:white;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.15);

    container-type:inline-size;
}

.card h1{
    font-size: clamp(2rem, 10vw, 4.5rem);
    line-height: .9;
    margin: 0 0 30px;
    text-align: center;
    white-space: nowrap;
}

input{
    width:90%;
    padding:15px;
    font-size:24px;
}

.note{
    margin-top:15px;
    font-size:20px;
    color:#666;
}

#result{
    margin-top:30px;
    font-size:26px;
}

.containerCard{
    margin-top:20px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:20px;
    text-align:center;
}

.containerCard img{
    margin:15px 0;
    max-width:100%;
}

.imageLabel{
    text-align:left;
    margin:20px 0 0px 0;
    
    font-size:18px;
}



</style>

</head>

<body>

<div class="card">

<h1>CONTAINERKOLLEN</h1>


<p>
    <a href="containertyper.html">Containertyper</a>
</p>

<input
    id="search"
    type="tel"
    inputmode="numeric"
    pattern="[0-9]*"
    placeholder="Container-ID"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
    oninput="searchContainer()">

<div id="result">

Laddar register...

</div>

</div>

<script>

let containers = {};
let containerTypes = {};

async function loadRegister(){

    try{

        // Containerregister
        const response = await fetch("container.json");
        const data = await response.json();

        containers = {};

        data.forEach(row=>{
            containers[String(row.id)] = row;
        });

        // Containertyper
        const typeResponse = await fetch("containertyper.json");
        const typeData = await typeResponse.json();

        containerTypes = {};

        typeData.forEach(row=>{
            containerTypes[row.typ] = row;
        });

        document.getElementById("result").innerHTML =
            "Skriv ett ID.";

    }

    catch(e){

        console.error(e);

        document.getElementById("result").innerHTML =
            "Kunde inte läsa json-filerna";

    }

}

function searchContainer(){

    const id =
        document.getElementById("search").value.trim();

    const div =
        document.getElementById("result");

    if(id===""){

        div.innerHTML="";
        return;

    }

    const c = containers[id];

    if(!c){

        div.innerHTML="Ingen träff";
        return;

    }

  const type = containerTypes[c.typ];

div.innerHTML = `
    <div class="containerCard">

        <h2>${c.typ}</h2>

         <p class="imageLabel"><strong>Exempelbild:</strong></p>

        ${
            type?.bild
            ? `<img src="${type.bild}" style="width:100%;border-radius:10px;">`
            : ""
        }

       

        <p><strong>ID:</strong> ${c.id}</p>

        ${
            c.note
            ? `<p class="note"><strong>Notering:</strong> ${c.note}</p>`
            : ""
        }

        ${
            type
            ? `
                <p><strong>Längd:</strong> ${type.langd} m</p>
                <p><strong>Bredd:</strong> ${type.bredd} m</p>
                <p><strong>Höjd:</strong> ${type.hojd} m</p>
            `
            : ""
        }

    </div>
`;

}

function fitTitle() {

    const title = document.querySelector(".card h1");
    const card = document.querySelector(".card");

    if (!title || !card) return;

    let size = 80;

    title.style.whiteSpace = "nowrap";

    while (size > 20) {

        title.style.fontSize = size + "px";

        if (title.scrollWidth <= card.clientWidth - 60) {
            break;
        }

        size--;

    }

}

window.addEventListener("load", fitTitle);
window.addEventListener("resize", fitTitle);


window.onload = loadRegister;

</script>

</body>
</html>
